server {
    listen 8080;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /static {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }

    include /etc/nginx/conf.d/security-headers.conf;
}
